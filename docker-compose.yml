version: '3.9'

services:

  backend:

    build: ./backend

    container_name: flask_backend

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app

    restart: always

  frontend:

    build: ./frontend

    container_name: react_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    restart: always

    depends_on:
      - backend